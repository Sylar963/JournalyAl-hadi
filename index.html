<!DOCTYPE html>
<html lang="en" data-theme="twilight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deltajournal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    >
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      body {
        font-family: "Inter", sans-serif;

        --bg-color: #07111a;
        --app-bg: #07111a;
        --surface-1: rgba(10, 19, 31, 0.92);
        --surface-2: rgba(14, 26, 40, 0.92);
        --surface-3: rgba(20, 36, 55, 0.96);
        --glass-bg: rgba(10, 19, 31, 0.76);
        --glass-border: rgba(148, 163, 184, 0.18);
        --glass-blur: 12px;
        --panel-border: rgba(148, 163, 184, 0.16);
        --panel-border-strong: rgba(148, 163, 184, 0.28);
        --accent-primary: #d8e0e8;
        --accent-secondary: #8a9aab;
        --accent-gradient: linear-gradient(
          135deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        --accent-soft: rgba(216, 224, 232, 0.12);
        --text-main: #e7edf4;
        --text-muted: #93a4b8;
        --text-subtle: #64748b;
        --positive-color: #4ade80;
        --negative-color: #f87171;
        --warning-color: #fbbf24;
        --info-color: #38bdf8;
        --grid-line-color: rgba(148, 163, 184, 0.08);
        --chart-glow-color-1: rgba(129, 140, 248, 0.06);
        --chart-glow-color-2: rgba(56, 189, 248, 0.05);
        --calendar-border: var(--panel-border);

        color: var(--text-main);
        background-color: var(--app-bg);
        transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
      }

      .dashboard-app {
        color: var(--text-main);
        background:
          radial-gradient(circle at top right, rgba(56, 189, 248, 0.04), transparent 24%),
          radial-gradient(circle at bottom left, rgba(59, 130, 246, 0.03), transparent 28%),
          var(--app-bg);
      }

      .journal-panel {
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 22%),
          var(--surface-1);
        border: 1px solid var(--panel-border);
        box-shadow: 0 16px 40px rgba(2, 6, 23, 0.22);
      }

      .journal-panel-muted {
        background: var(--surface-2);
        border: 1px solid var(--panel-border);
      }

      .journal-panel-strong {
        background: var(--surface-3);
        border: 1px solid var(--panel-border-strong);
      }

      .journal-sidebar {
        background: rgba(7, 17, 26, 0.94);
        border-right: 1px solid var(--panel-border);
      }

      .journal-topbar {
        background: rgba(7, 17, 26, 0.9);
        border-bottom: 1px solid var(--panel-border);
      }

      .journal-kicker {
        color: var(--text-subtle);
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .journal-input {
        background: var(--surface-2);
        border: 1px solid var(--panel-border);
        color: var(--text-main);
      }

      .journal-input::placeholder {
        color: var(--text-subtle);
      }

      .journal-input:focus {
        outline: none;
        border-color: var(--panel-border-strong);
        box-shadow: 0 0 0 1px rgba(216, 224, 232, 0.14);
      }

      .journal-tabbar {
        background: rgba(7, 17, 26, 0.76);
        border: 1px solid var(--panel-border);
      }

      .journal-tab {
        border: 1px solid transparent;
        color: var(--text-muted);
      }

      .journal-tab[data-active="true"] {
        background: var(--surface-3);
        border-color: var(--panel-border-strong);
        color: var(--text-main);
      }

      .journal-button-primary {
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        color: #07111a;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .journal-button-secondary {
        background: var(--surface-2);
        color: var(--text-main);
        border: 1px solid var(--panel-border);
      }

      .journal-button-danger {
        background: rgba(127, 29, 29, 0.18);
        color: #fca5a5;
        border: 1px solid rgba(248, 113, 113, 0.24);
      }

      .journal-metric {
        font-family: "JetBrains Mono", monospace;
        font-variant-numeric: tabular-nums;
      }

      .journal-divider {
        border-color: var(--panel-border);
      }

      /* Glass Panel Utility Class */
      .glass-panel {
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur));
        -webkit-backdrop-filter: blur(var(--glass-blur));
        border: 1px solid var(--glass-border);
        box-shadow: 0 12px 32px rgba(2, 6, 23, 0.18);
      }

      /* Gradient Text Utility */
      .text-gradient {
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      @keyframes cell-click-animation {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 rgba(250, 204, 21, 0);
        }

        50% {
          transform: scale(1.05);
          box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
          z-index: 10;
        }

        100% {
          transform: scale(1);
          box-shadow: 0 0 0 rgba(250, 204, 21, 0);
        }
      }

      .animate-cell-click {
        animation: cell-click-animation 0.4s ease-in-out;
      }

      @keyframes content-entry {
        from {
          opacity: 0;
          transform: scale(0.98) translateY(10px);
          filter: blur(2px);
        }

        to {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: blur(0px);
        }
      }

      .animate-content-entry {
        animation: content-entry 0.4s cubic-bezier(0.215, 0.610, 0.355, 1.000)
          forwards;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      .animate-fade-in {
        animation: fade-in 0.7s ease-in-out forwards;
      }

      @keyframes popover-enter {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(-10px);
        }

        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .animate-popover-enter {
        animation: popover-enter 0.2s cubic-bezier(0.215, 0.610, 0.355, 1.000)
          forwards;
        transform-origin: top right;
      }

      /* ===== DAY OF WEEK COLORS ===== */
      .day-su {
        color: #f87171;
      }

      /* red-400 */
      .day-mo {
        color: #fbbf24;
      }

      /* amber-400 */
      .day-tu {
        color: #fde047;
      }

      /* yellow-300 */
      .day-we {
        color: #a3e635;
      }

      /* lime-400 */
      .day-th {
        color: #38bdf8;
      }

      /* sky-400 */
      .day-fr {
        color: #818cf8;
      }

      /* indigo-400 */
      .day-sa {
        color: #a1a1aa;
      }
      /* zinc-400 */

      /* Energy Line Effect - Enterprise Grade */
      .energy-border {
        position: relative;
        border: 1px solid rgba(148, 163, 184, 0.16);
        box-shadow:
          0 16px 32px rgba(2, 6, 23, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        overflow: hidden;
      }

      /* Animated gradient shine effect */
      .energy-border::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 200%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.1),
          transparent
        );
        transition: left 0.5s ease;
        pointer-events: none;
      }

      .energy-border:hover {
        border-color: rgba(148, 163, 184, 0.28);
        box-shadow: 0 18px 36px rgba(2, 6, 23, 0.26);
        transform: translateY(-1px);
      }

      .energy-border:hover::before {
        left: 100%;
        transition: left 1s ease;
      }
    </style>
    <style>
      /* Invisible scrollbar - keep scrolling ability, hide visual bar */
      .custom-scrollbar {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
      }
      .custom-scrollbar::-webkit-scrollbar {
        display: none; /* Chrome, Safari, Opera */
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              heading: ["Space Grotesk", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            colors: {
              bg: {
                DEFAULT: "#050505",
                card: "#0a0a0a",
              },
            },
            animation: {
              "fade-in": "fade-in 0.6s ease-out forwards",
              "slide-up": "slide-up 0.5s ease-out forwards",
              "pulse-slow":
                "pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            },
            keyframes: {
              "fade-in": {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              "slide-up": {
                "0%": { opacity: "0", transform: "translateY(10px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
